scalar Unknown
scalar DateTime
scalar Attachment
scalar Address
scalar Amount_Tokens
scalar EthereumAddress
scalar EmailAddress
scalar Amount_Percentage
scalar Date
scalar URL
scalar Amount_Money
scalar OLabel
scalar Currency
scalar PHID
scalar OID
scalar Amount_Fiat
scalar Amount_Currency
scalar Amount_Crypto
scalar Amount
scalar Upload

type ServiceOfferingState {
    id: PHID!
    operatorId: PHID!
    resourceTemplateId: PHID
    title: String!
    summary: String!
    description: String
    thumbnailUrl: URL
    infoLink: URL
    status: ServiceStatus!
    lastModified: DateTime!
    availableBillingCycles: [BillingCycle!]!
    facetTargets: [FacetTarget!]!
    services: [Service!]!
    tiers: [ServiceSubscriptionTier!]!
    optionGroups: [OptionGroup!]!
}

enum ServiceStatus {
    DRAFT
    COMING_SOON
    ACTIVE
    DEPRECATED
}

enum BillingCycle {
    MONTHLY
    QUARTERLY
    SEMI_ANNUAL
    ANNUAL
}

type FacetTarget {
    id: OID!
    categoryKey: String!
    categoryLabel: String!
    selectedOptions: [String!]!
}

type Service {
    id: OID!
    title: String!
    description: String
    displayOrder: Int
    isSetupFormation: Boolean!
    optionGroupId: OID
}

type ServiceSubscriptionTier {
    id: OID!
    name: String!
    description: String
    isCustomPricing: Boolean!
    pricingMode: TierPricingMode!
    pricing: TierPricing
    defaultBillingCycle: BillingCycle
    billingCycleDiscounts: [BillingCycleDiscount!]!
    serviceLevels: [TierServiceLevel!]!
    usageLimits: [UsageLimit!]!
}

enum TierPricingMode {
    FIXED
    PER_SEAT
    CUSTOM
}

type TierPricing {
    amount: Amount_Money!
    currency: Currency!
}

type BillingCycleDiscount {
    cycle: BillingCycle!
    discountType: DiscountType!
    discountValue: Float!
}

enum DiscountType {
    PERCENTAGE
    FIXED_AMOUNT
}

type TierServiceLevel {
    id: OID!
    serviceId: OID!
    level: String!
    description: String
}

type UsageLimit {
    id: OID!
    name: String!
    limit: Int!
    unit: String
}

type OptionGroup {
    id: OID!
    name: String!
    description: String
    isAddOn: Boolean!
    defaultSelected: Boolean!
    pricingMode: AddOnPricingMode!
    standalonePricing: TierPricing
    tierDependentPricing: [TierDependentPricing!]!
    costType: GroupCostType
    availableBillingCycles: [BillingCycle!]!
    billingCycleDiscounts: [BillingCycleDiscount!]!
    discountMode: DiscountMode
    price: Amount_Money
    currency: Currency
}

enum AddOnPricingMode {
    STANDALONE
    TIER_DEPENDENT
}

enum GroupCostType {
    SETUP
    RECURRING
}

enum DiscountMode {
    OWN_DISCOUNTS
    INHERIT_TIER
}

type TierDependentPricing {
    tierId: OID!
    amount: Amount_Money!
    currency: Currency!
}

