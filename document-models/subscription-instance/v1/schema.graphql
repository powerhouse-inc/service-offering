scalar Unknown
scalar DateTime
scalar Attachment
scalar Address
scalar Amount_Tokens
scalar EthereumAddress
scalar EmailAddress
scalar Amount_Percentage
scalar Date
scalar URL
scalar Amount_Money
scalar OLabel
scalar Currency
scalar PHID
scalar OID
scalar Amount_Fiat
scalar Amount_Currency
scalar Amount_Crypto
scalar Amount
scalar Upload

type SubscriptionInstanceState {
    customerId: PHID
    customerName: String
    customerEmail: EmailAddress
    customerType: CustomerType
    teamMemberCount: Int
    operatorId: PHID
    serviceOfferingId: PHID
    tierName: String
    tierPricingOptionId: OID
    tierPrice: Amount_Money
    tierCurrency: Currency
    tierPricingMode: TierPricingMode
    selectedBillingCycle: BillingCycle
    globalCurrency: Currency
    resource: ResourceDocument
    status: SubscriptionStatus!
    createdAt: DateTime
    activatedSince: DateTime
    pausedSince: DateTime
    expiringSince: DateTime
    renewalDate: DateTime
    cancelledSince: DateTime
    cancellationReason: String
    autoRenew: Boolean!
    operatorNotes: String
    budget: BudgetCategory
    nextBillingDate: DateTime
    currentBillingCycleStart: DateTime
    totalDebt: Amount_Money
    totalCredit: Amount_Money
    services: [Service!]!
    serviceGroups: [ServiceGroup!]!
}

enum TierPricingMode {
    CALCULATED
    MANUAL_OVERRIDE
}

enum CustomerType {
    INDIVIDUAL
    TEAM
}

enum GroupCostType {
    RECURRING
    SETUP
}

enum SubscriptionStatus {
    PENDING
    ACTIVE
    PAUSED
    EXPIRING
    CANCELLED
}

enum DiscountType {
    PERCENTAGE
    FLAT_AMOUNT
}

enum DiscountSource {
    TIER_INHERITED
    GROUP_INDEPENDENT
    BUNDLE
}

enum BillingCycle {
    MONTHLY
    QUARTERLY
    SEMI_ANNUAL
    ANNUAL
    ONE_TIME
}

enum AccrualCycle {
    HOURLY
    DAILY
    WEEKLY
    MONTHLY
    QUARTERLY
    SEMI_ANNUAL
    ANNUAL
}

enum MetricType {
    CUMULATIVE
    NON_CUMULATIVE
}

type DiscountInfo {
    originalAmount: Amount_Money!
    discountType: DiscountType!
    discountValue: Float!
    source: DiscountSource!
}

type SetupCost {
    amount: Amount_Money!
    currency: Currency!
    paymentDate: DateTime
}

type RecurringCost {
    amount: Amount_Money!
    currency: Currency!
    billingCycle: BillingCycle!
    lastPaymentDate: DateTime
    discount: DiscountInfo
}

type ResourceDocument {
    id: PHID!
    label: String
    thumbnailUrl: URL
}

type BudgetCategory {
    id: OID!
    label: String!
}

type ServiceFacetSelection {
    id: OID!
    facetName: String!
    selectedOption: String!
}

type ServiceMetric {
    id: OID!
    name: String!
    unitName: String!
    freeLimit: Int
    paidLimit: Int
    unitCost: RecurringCost
    currentUsage: Int!
    metricType: MetricType!
    accrualCycle: AccrualCycle!
}

type Service {
    id: OID!
    name: String
    description: String
    customValue: String
    facetSelections: [ServiceFacetSelection!]!
    setupCost: SetupCost
    recurringCost: RecurringCost
    metrics: [ServiceMetric!]!
}

type ServiceGroup {
    id: OID!
    optional: Boolean!
    name: String!
    costType: GroupCostType
    setupCost: SetupCost
    recurringCost: RecurringCost
    services: [Service!]!
}

# subscription

input InitializeFacetSelectionInput {
    id: OID!
    facetName: String!
    selectedOption: String!
}

input DiscountInfoInitInput {
    originalAmount: Amount_Money!
    discountType: DiscountType!
    discountValue: Float!
    source: DiscountSource!
}

input InitializeMetricInput {
    id: OID!
    name: String!
    unitName: String!
    freeLimit: Int
    paidLimit: Int
    currentUsage: Int!
    metricType: MetricType!
    accrualCycle: AccrualCycle!
    unitCostAmount: Amount_Money
    unitCostCurrency: Currency
    unitCostBillingCycle: BillingCycle
}

input InitializeServiceInput {
    id: OID!
    name: String
    description: String
    customValue: String
    facetSelections: [InitializeFacetSelectionInput!]
    setupAmount: Amount_Money
    setupCurrency: Currency
    recurringAmount: Amount_Money
    recurringCurrency: Currency
    recurringBillingCycle: BillingCycle
    recurringDiscount: DiscountInfoInitInput
    metrics: [InitializeMetricInput!]
}

input InitializeServiceGroupInput {
    id: OID!
    name: String!
    optional: Boolean!
    costType: GroupCostType
    setupAmount: Amount_Money
    setupCurrency: Currency
    recurringAmount: Amount_Money
    recurringCurrency: Currency
    recurringBillingCycle: BillingCycle
    recurringDiscount: DiscountInfoInitInput
    services: [InitializeServiceInput!]
}

input InitializeSubscriptionInput {
    customerId: PHID
    customerName: String
    customerEmail: EmailAddress
    serviceOfferingId: PHID
    tierName: String
    tierPricingOptionId: OID
    tierPrice: Amount_Money
    tierCurrency: Currency
    tierPricingMode: TierPricingMode
    selectedBillingCycle: BillingCycle
    globalCurrency: Currency
    resourceId: PHID
    resourceLabel: String
    resourceThumbnailUrl: URL
    autoRenew: Boolean
    createdAt: DateTime!
    services: [InitializeServiceInput!]
    serviceGroups: [InitializeServiceGroupInput!]
}

input SetResourceDocumentInput {
    resourceId: PHID!
    resourceLabel: String
    resourceThumbnailUrl: URL
}

input ActivateSubscriptionInput {
    activatedSince: DateTime!
}

input PauseSubscriptionInput {
    pausedSince: DateTime!
}

input SetExpiringInput {
    expiringSince: DateTime!
}

input CancelSubscriptionInput {
    cancelledSince: DateTime!
    cancellationReason: String
}

input ResumeSubscriptionInput {
    timestamp: DateTime!
}

input RenewExpiringSubscriptionInput {
    timestamp: DateTime!
    newRenewalDate: DateTime
}

input SetBudgetCategoryInput {
    budgetId: OID!
    budgetLabel: String!
}

input RemoveBudgetCategoryInput {
    budgetId: OID!
}

input UpdateCustomerInfoInput {
    customerId: PHID
    customerName: String
    customerEmail: EmailAddress
}

input UpdateTierInfoInput {
    tierName: String
    tierPricingOptionId: OID
    tierPrice: Amount_Money
    tierCurrency: Currency
