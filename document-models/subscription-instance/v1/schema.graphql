}

input UpdateServiceRecurringCostInput {
    serviceId: OID!
    amount: Amount_Money!
    currency: Currency!
}

input ReportSetupPaymentInput {
    serviceId: OID!
    paidAmount: Amount_Money!
    paidAt: DateTime!
}

input ReportRecurringPaymentInput {
    serviceId: OID!
    paidAmount: Amount_Money!
    paidAt: DateTime!
}

input UpdateServiceInfoInput {
    serviceId: OID!
    name: String
    description: String
    customValue: String
}

input AddServiceFacetSelectionInput {
    serviceId: OID!
    id: OID!
