}

input SetOperatorNotesInput {
    operatorNotes: String
}

input SetAutoRenewInput {
    autoRenew: Boolean!
}

input SetRenewalDateInput {
    renewalDate: DateTime!
}

input SettleBillingCycleInput {
    settlementDate: DateTime!
}

