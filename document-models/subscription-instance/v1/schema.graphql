input AddServiceMetricInput {
    serviceId: OID!
    id: OID!
    name: String!
    unitName: String
    limit: Int
    freeLimit: Int
    paidLimit: Int
    unitCost: Amount_Money
    usageResetPeriod: ResetPeriod
