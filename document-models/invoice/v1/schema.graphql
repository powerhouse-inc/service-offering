scalar Unknown
scalar DateTime
scalar Attachment
scalar Address
scalar Amount_Tokens
scalar EthereumAddress
scalar EmailAddress
scalar Amount_Percentage
scalar Date
scalar URL
scalar Amount_Money
scalar OLabel
scalar Currency
scalar PHID
scalar OID
scalar Amount_Fiat
scalar Amount_Currency
scalar Amount_Crypto
scalar Amount
scalar Upload

type InvoiceState {
    invoiceNumber: String
    issuedAt: DateTime
    dueDate: DateTime
    status: InvoiceStatus!
    customerId: PHID
    customerName: String
    customerEmail: EmailAddress
    sourceSubscriptionId: PHID
    sourceSubscriptionName: String
    cycleStart: DateTime
    cycleEnd: DateTime
    billingCycle: InvoiceBillingCycle
    lineItems: [InvoiceLineItem!]!
    currency: Currency
    subtotal: Amount_Money!
    creditApplied: Amount_Money!
    totalDue: Amount_Money!
    totalPaid: Amount_Money!
    stripeInvoiceId: String
    notes: String
}

enum InvoiceStatus {
    DRAFT
    ISSUED
    PAID
    VOID
}

enum InvoiceBillingCycle {
    MONTHLY
    QUARTERLY
    SEMI_ANNUAL
    ANNUAL
    ONE_TIME
}

enum InvoiceLineItemOrigin {
    SETUP
    SUBSCRIPTION_FEE
    DYNAMIC
    ESTIMATED_USAGE
    RECONCILIATION
}

type InvoiceLineItem {
    id: OID!
    sliceId: OID!
    origin: InvoiceLineItemOrigin!
    description: String!
    sourceName: String
    chargedAt: DateTime!
    debitAmount: Amount_Money!
    settledAmount: Amount_Money!
    creditApplied: Amount_Money!
    amountDue: Amount_Money!
    currency: Currency!
}

# invoice

input InvoiceLineItemInput {
    id: OID!
    sliceId: OID!
    origin: InvoiceLineItemOrigin!
    description: String!
    sourceName: String
    chargedAt: DateTime!
    debitAmount: Amount_Money!
    settledAmount: Amount_Money!
    creditApplied: Amount_Money!
    amountDue: Amount_Money!
    currency: Currency!
}

input InitializeInvoiceInput {
    invoiceNumber: String
    dueDate: DateTime
    customerId: PHID
    customerName: String
    customerEmail: EmailAddress
    sourceSubscriptionId: PHID
    sourceSubscriptionName: String
    cycleStart: DateTime
    cycleEnd: DateTime
    billingCycle: InvoiceBillingCycle
    lineItems: [InvoiceLineItemInput!]!
    currency: Currency
    subtotal: Amount_Money!
    creditApplied: Amount_Money!
    totalDue: Amount_Money!
    totalPaid: Amount_Money!
    notes: String
}

input MarkInvoiceIssuedInput {
    issuedAt: DateTime!
}

input MarkInvoicePaidInput {
    paidAt: DateTime!
    paidAmount: Amount_Money!
}

input VoidInvoiceInput {
    voidedAt: DateTime!
    reason: String
}

input SetStripeInvoiceIdInput {
    stripeInvoiceId: String!
}

input SetInvoiceNotesInput {
    notes: String
}